[project]
name = "open-lab-animals-canada"
version = "0.1.0"
description = "Open data observatory and reporting-quality audit for animal-based research in Canada."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "scikit-learn>=1.5",
    "plotly>=5.22",
    "streamlit>=1.37",
    "tenacity>=8.3",
    "pypdf>=4.0",
]

[project.optional-dependencies]
funding = ["pyarrow>=15"]
figures = ["matplotlib>=3.8"]
llm = ["openai>=1.40"]
dbt = ["dbt-duckdb>=1.8"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
arrive-check = "olac.audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olac"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
