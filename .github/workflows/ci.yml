name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev,dbt]"
      - name: Lint
        run: .venv/bin/ruff check src tests app
      - name: Unit tests
        run: .venv/bin/pytest -q
      - name: Rebuild processed data from pinned raw files and run dbt tests
        run: |
          .venv/bin/python -m olac.ingest.ccac
          .venv/bin/python -m olac.ingest.intl
          .venv/bin/python -m olac.dq
          .venv/bin/python -m olac.analysis.index
          .venv/bin/python -m olac.analysis.trends
          .venv/bin/python -m olac.db
          .venv/bin/dbt build --project-dir dbt --profiles-dir dbt
      - name: Fail if committed processed data drifted from the pipeline
        run: git diff --exit-code -- data/processed/ccac_type_year.csv data/processed/transparency_index.csv
