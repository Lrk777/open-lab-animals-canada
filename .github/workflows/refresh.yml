name: refresh

# Weekly: re-download upstream sources, rebuild everything, and open a pull request if any
# upstream file changed (e.g. CCAC publishes a new annual report or silently edits an old one).
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev,dbt]"
      - name: Download with checksum manifest
        run: .venv/bin/python -m olac.ingest.download --force
      - name: Rebuild
        run: |
          .venv/bin/python -m olac.ingest.ccac
          .venv/bin/python -m olac.ingest.intl
          .venv/bin/python -m olac.dq
          .venv/bin/python -m olac.analysis.index
          .venv/bin/python -m olac.analysis.trends
          .venv/bin/python -m olac.audit.corpus
          .venv/bin/python -m olac.audit.extract --backend rules
          .venv/bin/python -m olac.audit.its
          .venv/bin/python -m olac.db
          .venv/bin/dbt build --project-dir dbt --profiles-dir dbt
      - name: Did any upstream file change?
        id: upstream
        run: |
          if git diff --quiet -- data/raw/manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream change; rebuild differences (if any) are not proposed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Changelog entry
        if: steps.upstream.outputs.changed == 'true'
        run: |
          echo "- $(date -u +%F): upstream change detected: $(git diff --name-only -- data/ | tr '\n' ' ')" >> CHANGELOG.md
      - name: Fail if any full-text fetch failed without a previous value
        if: steps.upstream.outputs.changed == 'true'
        run: |
          .venv/bin/python -c "import pandas as pd, sys; c = pd.read_csv('data/processed/corpus.csv'); bad = c[~c.fetch_ok & (c.n_methods_chars == 0)]; print(len(bad), 'unrecovered fetch failures'); sys.exit(1 if len(bad) else 0)"
      - uses: peter-evans/create-pull-request@v6
        if: steps.upstream.outputs.changed == 'true'
        with:
          title: "Data refresh: upstream sources changed"
          commit-message: "Data refresh from upstream sources"
          branch: data-refresh
          body: |
            Automated weekly refresh. Review `data/raw/manifest.json` for which upstream files changed,
            `docs/data_quality_report.md` for new data-quality issues, and the dbt test results.
